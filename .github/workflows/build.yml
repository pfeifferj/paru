name: Build Release
on:
  push:
    tags:
      - v*
    branches:
      - test-release/*

permissions:
  contents: read

jobs:
  build-releases:
    name: Build ${{ matrix.platform.arch }} release
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        platform:
          - docker: amd64
            arch: x86_64
          - docker: arm64/v8
            arch: aarch64
          - docker: arm/v7
            arch: armv7h

    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: docker/setup-qemu-action@v3
        with:
          platforms: all
      - uses: docker/setup-buildx-action@v3
        with:
          version: latest
      - run: docker buildx build --platform=linux/${{ matrix.platform.docker }} -o . .
      - uses: actions/upload-artifact@v7
        with:
          name: paru-${{ matrix.platform.arch }}
          path: paru.tar.zst
          if-no-files-found: error
          compression-level: 0
          overwrite: true

  release:
    name: Create draft release
    if: github.ref_type == 'tag'
    runs-on: ubuntu-latest
    needs: build-releases
    permissions:
      contents: write
    concurrency: release-${{ github.ref }}
    steps:
      - uses: actions/download-artifact@v8
        with:
          pattern: paru-*
          path: artifacts
      - name: Upload release assets
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          for arch in x86_64 aarch64 armv7h; do
            mv "artifacts/paru-$arch/paru.tar.zst" "paru-$RELEASE_TAG-$arch.tar.zst"
          done

          if gh release view "$RELEASE_TAG" --json isDraft,assets > release.json; then
            if ! jq -e '.isDraft' release.json > /dev/null; then
              echo "Release $RELEASE_TAG is already published" >&2
              exit 1
            fi
          else
            gh release create "$RELEASE_TAG" --verify-tag --draft --title "Paru $RELEASE_TAG" --notes ''
            printf '{"assets":[]}\n' > release.json
          fi

          for asset in paru-*.tar.zst; do
            if jq -e --arg name "$asset" '.assets[] | select(.name == $name)' release.json > /dev/null; then
              if ! jq -e --arg name "$asset" '.assets[] | select(.name == $name) | .state == "uploaded" and .size > 0' release.json > /dev/null; then
                echo "Release asset $asset is incomplete; delete it before rerunning" >&2
                exit 1
              fi
            else
              gh release upload "$RELEASE_TAG" "$asset"
            fi
          done

